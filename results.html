<!DOCTYPE html>
<html>
<head>
<title>Verification Result</title>
<style>
body { font-family: Arial; text-align: center; padding: 50px; }
img { max-width: 400px; margin: 20px 0; }
</style>
</head>
<body>
<h1>Authentication Result</h1>
<p id="result">Looking up your item...</p>
<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');
const resultDiv = document.getElementById("result");

async function loadItem() {
  if (!code) {
    resultDiv.innerHTML = "No number entered.";
    return;
  }

  resultDiv.innerHTML = "🔍 Searching database...";

  try {
    const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vT_a1Xb90hw_NYsgluErxATqSw-iIPajwz0TQm1YNzOnX4iurl5fiZGq96rtyP-hFH0arlav5Wrbard/pub?output=csv');
    const csvText = await response.text();

    const lines = csvText.trim().split('\n');
    
    for (let i = 1; i < lines.length; i++) {
      // Split by comma but handle quotes better
      let columns = [];
      let current = '';
      let inQuotes = false;
      
      for (let char of lines[i]) {
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          columns.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      columns.push(current.trim());

      if (columns.length > 0 && columns[0].replace(/"/g, '').trim() === code.trim()) {
        const name = columns[1] ? columns[1].replace(/"/g, '') : "Unknown";
        const artist = columns[2] ? columns[2].replace(/"/g, '') : "";
        const date = columns[3] ? columns[3].replace(/"/g, '') : "";
        const description = columns[4] ? columns[4].replace(/"/g, '') : "";
        const status = columns[5] ? columns[5].replace(/"/g, '') : "Authenticated";
        const image = columns[6] ? columns[6].replace(/"/g, '') : "";

        resultDiv.innerHTML = `
          <h2>${name}</h2>
          <p><strong>Artist:</strong> ${artist}</p>
          <p><strong>Date:</strong> ${date}</p>
          <p><strong>Description:</strong> ${description}</p>
          <p><strong>Status:</strong> <span style="color:green; font-weight:bold;">${status}</span></p>
          <br>
          ${image ? `<img src="${image}" alt="${name}" style="max-width:500px; border:2px solid #ddd; border-radius:8px;">` : ''}
        `;
        return;
      }
    }

    resultDiv.innerHTML = `<strong>Code "${code}" not found.</strong><br><br>Double-check the Code in your Google Sheet.`;

  } catch (error) {
    console.error(error);
    resultDiv.innerHTML = "Could not connect to Google Sheet.<br>Make sure it's published as CSV.";
  }
}

loadItem();
</script></body>
</html>
