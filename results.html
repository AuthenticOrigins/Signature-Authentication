<!DOCTYPE html>
<html>
<head>
<title>Verification Result</title>
<style>
body { font-family: Arial; text-align: center; padding: 50px; }
img { max-width: 400px; margin: 20px 0; }
</style>
</head>
<body>
<h1>Authentication Result</h1>
<p id="result">Looking up your item...</p>
<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

const database = {
  "12345": {
    name: "Original Painting",
    artist: "John Smith",
    date: "2024-01-15",
    description: "Hand-signed limited edition",
    status: "Authenticated",
    image: "images/painting.jpg"
  },
  "67890": {
    name: "Sketch Book",
    artist: "Maria Lopez",
    date: "2023-05-20",
    description: "Pencil sketch on paper",
    status: "Authenticated",
    image: "images/sketch.jpg"
  }
};

if (!code) {
  document.getElementById("result").innerHTML = "No number entered.";
} else {
  const item = database[code];
  
  if (item) {
    document.getElementById("result").innerHTML = `
      <h2>${item.name}</h2>
      <p><strong>Artist:</strong> ${item.artist}</p>
      <p><strong>Date:</strong> ${item.date}</p>
      <p><strong>Description:</strong> ${item.description}</p>
      <p><strong>Status:</strong> <span style="color:green;">${item.status}</span></p>
      <br>
      <img src="${item.image}" alt="${item.name}" style="max-width:500px; border:2px solid #ddd; border-radius:8px;">
    `;
  } else {
    document.getElementById("result").innerHTML = `<strong>Code "${code}" not found.</strong><br><br>Please check the number and try again.`;
  }
}
</script></body>
</html>
