<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Result - Authentic Origins</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f8f9fa;
            text-align: center;
        }
        .certificate {
            max-width: 800px;
            margin: 30px auto;
            padding: 50px 40px;
            background: white;
            border: 12px solid #1a1a1a;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }
        .certificate::before {
            content: "✓ AUTHENTIC ORIGINS";
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 1.1rem;
            color: #28a745;
            font-weight: bold;
            opacity: 0.9;
        }
        h1 {
            color: #1a1a1a;
            margin-top: 0;
        }
        .details {
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.8;
            margin: 30px 0;
        }
        img {
            max-width: 100%;
            max-height: 420px;
            margin: 20px 0;
            border: 1px solid #ddd;
        }
        button {
            padding: 16px 32px;
            font-size: 1.1rem;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 15px 8px;
        }
        button:hover { background: #218838; }
        .back-btn {
            background: #6c757d;
        }
    </style>
</head>
<body>
    <div class="certificate" id="certificate">
        <h1>Certificate of Authenticity</h1>
        <p><strong>Authentic Origins • Established 1988</strong></p>
        
        <div class="details" id="details"></div>
        
        <img id="item-image" src="" alt="Authenticated Item">
        
        <p style="margin-top:40px; font-size:0.95rem; color:#555;">
            This item has been meticulously examined and authenticated by our specialists.<br>
            <strong>Certificate Number:</strong> <span id="cert-number"></span>
        </p>
    </div>

    <button onclick="downloadPDF()">📄 Download Certificate (PDF)</button>
    <button onclick="window.location.href='index.html'" class="back-btn">← Back to Verification</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        async function loadItem() {
            const detailsDiv = document.getElementById("details");
            const imageEl = document.getElementById("item-image");
            const certNumber = document.getElementById("cert-number");

            if (!code) {
                detailsDiv.innerHTML = "<strong>No code entered.</strong>";
                return;
            }

            try {
                const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vT_a1Xb90hw_NYsgluErxATqSw-iIPajwz0TQm1YNzOnX4iurl5fiZGq96rtyP-hFH0arlav5Wrbard/pub?output=csv');
                const csvText = await response.text();
                const lines = csvText.trim().split('\n');

                for (let i = 1; i < lines.length; i++) {
                    let columns = [];
                    let current = '';
                    let inQuotes = false;

                    for (let char of lines[i]) {
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) {
                            columns.push(current.trim());
                            current = '';
                        } else current += char;
                    }
                    columns.push(current.trim());

                    if (columns[0].replace(/"/g, '').trim() === code.trim()) {
                        const name = columns[1] ? columns[1].replace(/"/g, '') : "Unknown";
                        const artist = columns[2] ? columns[2].replace(/"/g, '') : "";
                        const date = columns[3] ? columns[3].replace(/"/g, '') : "";
                        const description = columns[4] ? columns[4].replace(/"/g, '') : "";
                        const status = columns[5] ? columns[5].replace(/"/g, '') : "Authenticated";
                        const image = columns[6] ? columns[6].replace(/"/g, '') : "";

                        detailsDiv.innerHTML = `
                            <p><strong>Item:</strong> ${name}</p>
                            <p><strong>Artist / Creator:</strong> ${artist}</p>
                            <p><strong>Date:</strong> ${date}</p>
                            <p><strong>Description:</strong> ${description}</p>
                            <p><strong>Status:</strong> <span style="color:green; font-weight:bold;">${status}</span></p>
                            <p><strong>Authentication Code:</strong> ${code}</p>
                        `;

                        if (image) imageEl.src = image;
                        certNumber.textContent = code + "-" + new Date().getFullYear();

                        return;
                    }
                }

                detailsDiv.innerHTML = `<strong>Code "${code}" not found.</strong>`;
            } catch (e) {
                detailsDiv.innerHTML = "Error loading certificate information.";
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({
                orientation: "portrait",
                unit: "px",
                format: [800, 1000]
            });

            doc.setFont("helvetica", "bold");
            doc.setFontSize(28);
            doc.text("Certificate of Authenticity", 400, 80, { align: "center" });

            doc.setFontSize(16);
            doc.text("Authentic Origins • Established 1988", 400, 120, { align: "center" });

            // Copy the details
            const detailsText = document.getElementById("details").innerText;
            doc.setFont("helvetica", "normal");
            doc.setFontSize(14);
            const splitText = doc.splitTextToSize(detailsText, 600);
            doc.text(splitText, 100, 180);

            doc.setFontSize(12);
            doc.text("This item has been independently examined and verified as authentic.", 100, 320);
            doc.text("Certificate Number: " + document.getElementById("cert-number").textContent, 100, 350);

            doc.save(`Authentic-Origins-Certificate-${code || 'Unknown'}.pdf`);
        }

        // Load the item when page loads
        loadItem();
    </script>
</body>
</html>
