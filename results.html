<!DOCTYPE html>
<html>
<head>
<title>Verification Result</title>
<style>
body { font-family: Arial; text-align: center; padding: 50px; }
img { max-width: 400px; margin: 20px 0; }
</style>
</head>
<body>
<h1>Authentication Result</h1>
<p id="result">Looking up your item...</p>
<script>
const urlParams = new URLSearchParams(window.location.search);
const code = urlParams.get('code');

async function loadItem() {
  const resultDiv = document.getElementById("result");
  
  if (!code) {
    resultDiv.innerHTML = "No number entered.";
    return;
  }

  try {
    const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQIRLwNQAoKRJOzJP4LEILfMaL6yb_p7fOO1q7z9QAJfPsWP4yZ8BqdgXAZvaIh4djkjMo8cH94Re1H/pub?output=csv');
    const csvText = await response.text();
    
    const rows = csvText.trim().split('\n');
    const headers = rows[0].split(',').map(h => h.trim().replace(/"/g, ''));
    
    let item = null;
    
    for (let i = 1; i < rows.length; i++) {
      const values = rows[i].split(',').map(v => v.trim().replace(/"/g, ''));
      if (values[0] === code) {
        item = {
          name: values[1] || "Unknown",
          artist: values[2] || "",
          date: values[3] || "",
          description: values[4] || "",
          status: values[5] || "Authenticated",
          image: values[6] || ""
        };
        break;
      }
    }

    if (item) {
      resultDiv.innerHTML = `
        <h2>${item.name}</h2>
        <p><strong>Artist:</strong> ${item.artist}</p>
        <p><strong>Date:</strong> ${item.date}</p>
        <p><strong>Description:</strong> ${item.description}</p>
        <p><strong>Status:</strong> <span style="color:green; font-weight:bold;">${item.status}</span></p>
        <br>
        ${item.image ? `<img src="${item.image}" alt="${item.name}" style="max-width:500px; border:2px solid #ddd; border-radius:8px;">` : ''}
      `;
    } else {
      resultDiv.innerHTML = `<strong>Code "${code}" not found.</strong><br><br>Please check the number and try again.`;
    }
  } catch (error) {
    resultDiv.innerHTML = "Error loading database. Please try again later.";
  }
}

loadItem();
</script></body>
</html>
